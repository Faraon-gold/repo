<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - Система учёта посещаемости</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2196F3;
        }

        .welcome {
            text-align: center;
            margin-bottom: 2rem;
        }

        .welcome h1 {
            color: #333;
            margin-bottom: 0.5rem;
        }

        .welcome p {
            color: #666;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn {
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        .btn-admin {
            background: linear-gradient(45deg, #FF9800, #F57C00);
        }

        .btn-profile {
            background: linear-gradient(45deg, #4CAF50, #45a049);
        }

        .btn-exit {
            background: linear-gradient(45deg, #f44336, #d32f2f);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .buttons-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Система учёта посещаемости</div>
            <button class="btn btn-exit" onclick="logout()">Выход</button>
        </header>
        
        <div class="welcome">
            <h1>Добро пожаловать в систему!</h1>
            <p>Выберите действие из списка ниже</p>
        </div>
        
        <div class="buttons-grid">
            <a href="/schedule" class="btn">Посмотреть расписание</a>
            <a href="/attendance/mark" class="btn">Отметить посещаемость</a>
            <a id="add-user-btn" href="/admin/users" class="btn btn-admin hidden">Добавить пользователя</a>
            <a href="/profile" class="btn btn-profile">Личный кабинет</a>
        </div>
    </div>

    <script>
        // Check user role and show/hide admin button
        document.addEventListener('DOMContentLoaded', function() {
            checkUserRole();
        });

        async function checkUserRole() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    // Not logged in, redirect to login
                    window.location.href = '/login';
                    return;
                }

                const response = await fetch('/api/users/me', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const userData = await response.json();
                    
                    // Show admin button if user is admin
                    if (userData.role === 'admin') {
                        document.getElementById('add-user-btn').classList.remove('hidden');
                    }
                } else {
                    // Token invalid, redirect to login
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Error checking user role:', error);
                window.location.href = '/login';
            }
        }

        async function logout() {
            // Clear token
            localStorage.removeItem('access_token');
            
            // Redirect to home page
            window.location.href = '/';
        }
    </script>
</body>
</html>
