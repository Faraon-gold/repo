<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить пользователя - Система учёта посещаемости</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2196F3;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #555;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        .monitor-checkbox {
            display: none; /* Initially hidden */
        }

        .btn {
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        .btn-back {
            background: linear-gradient(45deg, #9e9e9e, #616161);
        }

        .btn-save {
            background: linear-gradient(45deg, #4CAF50, #45a049);
        }

        .error-message {
            color: #f44336;
            margin-top: 0.5rem;
        }

        .success-message {
            color: #4CAF50;
            margin-top: 0.5rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Система учёта посещаемости</div>
            <a href="/app" class="btn btn-back">Назад</a>
        </header>
        
        <h1>Добавить пользователя</h1>
        
        <form id="add-user-form">
            <div class="form-group">
                <label for="full-name">ФИО:</label>
                <input type="text" id="full-name" required>
            </div>
            
            <div class="form-group">
                <label for="login">Логин:</label>
                <input type="text" id="login" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" required>
            </div>
            
            <div class="form-group">
                <label for="role">Роль:</label>
                <select id="role" required onchange="toggleMonitorCheckbox()">
                    <option value="">Выберите роль</option>
                    <option value="admin">Администратор</option>
                    <option value="dean">Декан</option>
                    <option value="teacher">Преподаватель</option>
                    <option value="student">Студент</option>
                    <option value="monitor">Староста</option>
                </select>
            </div>
            
            <div class="form-group" id="group-select" style="display:none;">
                <label for="group-id">Группа:</label>
                <select id="group-id">
                    <option value="">Не указана</option>
                </select>
            </div>
            
            <div class="form-group monitor-checkbox" id="monitor-checkbox" style="display:none;">
                <label>
                    <input type="checkbox" id="is-monitor"> Назначить старостой
                </label>
            </div>
            
            <button type="submit" class="btn btn-save">Сохранить пользователя</button>
        </form>
        
        <div id="message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadGroups();
        });

        function toggleMonitorCheckbox() {
            const roleSelect = document.getElementById('role');
            const monitorCheckboxDiv = document.getElementById('monitor-checkbox');
            const groupSelect = document.getElementById('group-select');
            const isStudent = roleSelect.value === 'student';
            const isMonitor = roleSelect.value === 'monitor';
            
            // Show group selection for students and monitors
            if (isStudent || isMonitor) {
                groupSelect.style.display = 'block';
            } else {
                groupSelect.style.display = 'none';
            }
            
            // Show monitor checkbox only for students
            if (isStudent) {
                monitorCheckboxDiv.style.display = 'block';
            } else {
                monitorCheckboxDiv.style.display = 'none';
                // Uncheck the checkbox if not showing
                document.getElementById('is-monitor').checked = false;
            }
        }

        async function loadGroups() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    window.location.href = '/login';
                    return;
                }

                const response = await fetch('/api/groups', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const groups = await response.json();
                    const groupSelect = document.getElementById('group-id');
                    
                    groups.forEach(group => {
                        const option = document.createElement('option');
                        option.value = group.id;
                        option.textContent = group.name;
                        groupSelect.appendChild(option);
                    });
                } else {
                    console.error('Failed to load groups');
                }
            } catch (error) {
                console.error('Error loading groups:', error);
            }
        }

        document.getElementById('add-user-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('full-name').value;
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const groupId = document.getElementById('group-id').value || null;
            const isMonitor = document.getElementById('is-monitor').checked;
            
            // Determine the actual role
            let finalRole = role;
            if (role === 'student' && isMonitor) {
                finalRole = 'monitor';
            }
            
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    window.location.href = '/login';
                    return;
                }

                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        full_name: fullName,
                        login: login,
                        password: password,
                        role: finalRole,
                        group_id: groupId
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById('message').innerHTML = '<div class="success-message">Пользователь успешно добавлен!</div>';
                    document.getElementById('add-user-form').reset();
                } else {
                    document.getElementById('message').innerHTML = '<div class="error-message">' + (result.detail || 'Ошибка при добавлении пользователя') + '</div>';
                }
            } catch (error) {
                console.error('Error adding user:', error);
                document.getElementById('message').innerHTML = '<div class="error-message">Ошибка при добавлении пользователя</div>';
            }
        });
    </script>
</body>
</html>
