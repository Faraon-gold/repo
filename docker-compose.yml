version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://attendance_user:attendance_pass@db:5432/postgres
    command: >
      sh -c "python init_db.py && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql  # Changed from /var/lib/postgresql/data to /var/lib/postgresql for PG 18+

volumes:
  postgres_data:
